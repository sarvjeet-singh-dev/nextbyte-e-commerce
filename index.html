<!doctype html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" href="/nextbyte-e-commerce/assets/logo-BgBqhIZE.png" sizes="">
  <title>NEXBYTE | Home</title>

  <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet"/>

  <script type="module" crossorigin src="/nextbyte-e-commerce/assets/main-Bb4kdqul.js"></script>
  <link rel="stylesheet" crossorigin href="/nextbyte-e-commerce/assets/main-CKV9XxaC.css">
</head>

<body id="home-page" class="bg-[#0B1120] text-white min-h-screen overflow-x-hidden" >
  
  <header class="p-4 bg-[#0B1120]/95 text-white fixed w-full top-0 z-10 backdrop-blur-sm  lg:h-20 px-6 transition-all duration-300">
    <div id="nav-container" class="flex items-center justify-between"></div>
  </header>
  
  <main class="flex flex-col items-center md:items-start text-center md:text-left w-full">
    
  <div 
    id="hover-notification" 
    class="fixed top-15 md:top-5 right-5 md:right-12 z-50 w-full max-w-[90vw] sm:max-w-sm translate-x-[120%] opacity-0 transition-all duration-500 ease-out"
  >
    <div class="relative bg-[#0B1120]/95 backdrop-blur-md border border-white/10 shadow-2xl shadow-black/50 rounded-xl p-4 flex items-center gap-3 overflow-hidden">

      <div class="text-green-400 text-2xl shrink-0 drop-shadow-[0_0_8px_rgba(74,222,128,0.3)]">
        <i class="ri-checkbox-circle-fill"></i>
      </div>
      
      <div class="flex-1 min-w-0">
        <h3 id="notification-message" class="font-semibold text-white text-sm leading-tight">
          Added to Cart
        </h3>
        
        <p id="sub-message" class="text-xs text-gray-400 mt-1 line-clamp-2 wrap-break-words">
        </p>
      </div>
      
      <div
        id="notification-progress"
        class="absolute bottom-0 left-0 h-1 bg-green-500 rounded-b-xl w-0 transition-all duration-100 ease-linear"
      ></div>
      
    </div>
  </div>
    
    <!--Hero Section  -->
    <section id="hero" class="max-w-7xl mx-auto min-h-[90vh] grid grid-cols-1 md:grid-cols-2 gap-16 items-center px-6 pt-32"> </section>
    
    <!-- Categories Section -->
    <section id="categories" class="max-w-7xl mx-auto px-6 py-20"></section>
    
    <!-- Featured Products Section -->
    <section id="featured-products" class="max-w-7xl mx-auto w-full mt-16 px-6"></section>
    
    <!-- WHY CHOOSE US SECTION Section -->
    <section id="why-choose-us" class="max-w-7xl mx-auto w-full border-gray-500 rounded-2xl relative overflow-hidden py-24 px-6"></section>
    
    <!-- Promo Banner Section -->
    <section id="promo-banner" class="max-w-7xl mx-auto w-full px-6 border-gray-500 rounded-2xl py-15"></section>
    
    <!-- Newsletter Section -->
    <section id="newsletter" class=" mx-auto relative overflow-hidden py-24 px-6"></section>
  
  </main>


<footer id="footer-section" class="mt-24 px-6"></footer>

</body>
</html>
